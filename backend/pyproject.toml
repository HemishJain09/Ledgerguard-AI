[project]
name = "ledger_guard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HemishJain09", email = "hemishjain09@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "colorama>=0.4.6",
    "langchain>=1.3.18",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "langsmith>=0.12.1",
    "networkx>=3.6.1",
    "numpy>=2.5.2",
    "pdfplumber>=0.11.10",
    "polars>=1.44.1",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-levenshtein>=0.27.4",
    "pytz>=2026.3.post1",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "sqlalchemy>=2.0.52",
    "thefuzz>=0.22.1",
]

[project.scripts]
ledger_guard = "ledger_guard:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]
